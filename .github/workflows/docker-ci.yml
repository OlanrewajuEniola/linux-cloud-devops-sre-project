name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          ls -la docker-basic-web-app
          test -f docker-basic-web-app/Dockerfile
          test -f docker-basic-web-app/app.py
          test -f docker-basic-web-app/requirements.txt

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t cocomiyati/docker-basic-web-app:latest ./docker-basic-web-app

      - name: Push Docker image to Docker Hub
        run: |
          docker push cocomiyati/docker-basic-web-app:latest

      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "./deploy-docker-app.sh"

          