apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-web-app

spec:
  replicas: 6
  
  selector:
    matchLabels:
      app: python-web-app

  template:
    metadata:
      labels:
        app: python-web-app 
  
    spec:
      containers:
        - name: python-web-app
          image: cocomiyati/docker-basic-web-app:latest
          ports:
            - containerPort: 5000 

---
apiVersion: v1
kind: Service

metadata:
  name: python-web-app-service

spec:
  type: NodePort

  selector:
    app: python-web-app

  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080